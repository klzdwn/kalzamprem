<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KALZ AM PREM</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: #090d16;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 20px 100px 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Efek Background Glow */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      animation: float 10s infinite alternate ease-in-out;
    }

    .blob-1 {
      width: 300px;
      height: 300px;
      background: rgba(147, 51, 234, 0.45);
      top: 10%;
      left: 15%;
    }

    .blob-2 {
      width: 250px;
      height: 250px;
      background: rgba(59, 130, 246, 0.45);
      bottom: 15%;
      right: 15%;
    }

    @keyframes float {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-30px) scale(1.1); }
    }

    /* Card Utama */
    .glass-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      color: #ffffff;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header p {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 6px;
    }

    /* Step Tracker */
    .step-tracker {
      display: flex;
      justify-content: space-between;
      margin-bottom: 24px;
      position: relative;
    }

    .step-tracker::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(255, 255, 255, 0.1);
      z-index: 0;
      transform: translateY(-50%);
    }

    .step-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #1e293b;
      border: 2px solid rgba(255, 255, 255, 0.2);
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      position: relative;
      z-index: 1;
    }

    .step-circle.active {
      background: #a855f7;
      border-color: #c084fc;
      color: #fff;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
    }

    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .info-box {
      background: rgba(255, 255, 255, 0.04);
      border-left: 3px solid #a855f7;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 18px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
      box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4);
    }

    /* OVERLAY MODAL */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(4, 7, 13, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 99;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .hidden { display: none !important; }

    /* POPUP MUSIC PLAYER (PERSIS FOTO 3) */
    .music-modal-card {
      background: #111622;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      width: 100%;
      max-width: 380px;
      padding: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
      position: relative;
      animation: modalPop 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes modalPop {
      from { transform: scale(0.9) translateY(15px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #94a3b8;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    /* Cover Art */
    .music-cover {
      width: 100%;
      height: 210px;
      border-radius: 18px;
      object-fit: cover;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }

    .now-playing-tag {
      font-size: 11px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .now-playing-tag span {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #38bdf8;
      border-radius: 50%;
    }

    .song-title {
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: left;
    }

    .song-artist {
      color: #64748b;
      font-size: 13px;
      margin-top: 2px;
      text-align: left;
      margin-bottom: 18px;
    }

    /* Slider Progress */
    .time-slider-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .time-slider {
      width: 100%;
      accent-color: #ffffff;
      height: 4px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      color: #64748b;
      font-size: 11px;
      font-weight: 500;
    }

    /* Tombol-tombol Controls */
    .btn-controls-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 28px;
      margin-bottom: 20px;
    }

    .btn-music-action {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .btn-music-action:hover {
      color: #ffffff;
    }

    .btn-play-main {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #ffffff;
      color: #090d16;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.3);
      transition: transform 0.2s ease;
    }

    .btn-play-main:hover {
      transform: scale(1.06);
    }

    /* Volume Slider */
    .volume-row {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #64748b;
    }

    .volume-slider {
      width: 100%;
      accent-color: #38bdf8;
      height: 4px;
      cursor: pointer;
    }

    /* BOTTOM NAVBAR DI TENGAH */
    .bottom-nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(18, 24, 38, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50px;
      padding: 6px 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 14px;
      border-radius: 20px;
      color: #94a3b8;
      background: transparent;
      border: none;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      gap: 4px;
    }

    .nav-item svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    /* Tombol Home Bulat Glow di Tengah */
    .nav-item-center {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #ffffff;
      color: #090d16;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
      margin: 0 6px;
    }

    .nav-item-center svg {
      width: 20px;
      height: 20px;
      stroke: #090d16;
      fill: none;
      stroke-width: 2.2;
    }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="glass-card">
    <div class="header">
      <h1>KALZ AM PREM</h1>
      <p>Langkah 1: Masukkan email akun Alight Motion</p>
    </div>

    <div class="step-tracker">
      <div class="step-circle active">1</div>
      <div class="step-circle">2</div>
      <div class="step-circle">3</div>
    </div>

    <div>
      <div class="info-box">
        Ketik email yang terhubung dengan Alight Motion kamu. Sistem akan mengirim tautan masuk (Magic Link) ke email tersebut.
      </div>
      <div class="form-group">
        <label for="email">Alamat Email</label>
        <input type="email" id="email" placeholder="contoh@gmail.com">
      </div>
      <button class="btn">Kirim Magic Link</button>
    </div>
  </div>

  <!-- POPUP MUSIC PLAYER (PERSIS FOTO 3) -->
  <div class="modal-overlay hidden" id="modalMusic">
    <div class="music-modal-card">
      <button class="close-btn" id="btnCloseMusic">&times;</button>

      <!-- Gambar Cover Lagu dari Spotify Playlist -->
      <img id="musicCover" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&auto=format&fit=crop&q=60" alt="Cover" class="music-cover">

      <div class="now-playing-tag">
        <span></span> NOW PLAYING
      </div>

      <div class="song-title" id="songTitle">Justin Bieber - Beauty And A Beat (Of...</div>
      <div class="song-artist" id="songArtist">Justin Bieber</div>

      <!-- Controls & Progress Bar -->
      <div class="time-slider-container">
        <input type="range" class="time-slider" id="musicSeek" value="0" min="0" max="100">
        <div class="time-labels">
          <span id="currentTime">0:09</span>
          <span id="totalTime">6:12</span>
        </div>
      </div>

      <div class="btn-controls-row">
        <button class="btn-music-action" id="btnPrev">
          <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        
        <button class="btn-play-main" id="btnMusicPlay">
          <svg id="playIcon" width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" class="hidden" width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>

        <button class="btn-music-action" id="btnNext">
          <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>

      <div class="volume-row">
        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.1" value="0.8">
      </div>

      <!-- Integrasi Spotify Widget Embed (Opsional Jika Ingin Direct Spotify Stream) -->
      <div id="spotifyEmbedContainer" class="hidden" style="margin-top: 15px;">
        <iframe src="https://open.spotify.com/embed/playlist/4dWDoT3WBviqWbXK2aX8Rr?utm_source=generator&theme=0" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" style="border-radius: 12px;"></iframe>
      </div>
    </div>
  </div>

  <!-- Audio Player Source -->
  <audio id="bgAudio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

  <!-- BOTTOM NAVBAR (POSISI HOME DI TENGAH) -->
  <div class="bottom-nav">
    <a href="https://wa.me/6281234567890" target="_blank" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 21l1.9-5.7a8.5 8.5 0 113.8 3.8z"/></svg>
      <span>WHATSAPP</span>
    </a>

    <!-- TOMBOL HOME DI TENGAH -->
    <button class="nav-item-center" id="navHome">
      <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </button>

    <button class="nav-item" id="navMusic">
      <svg viewBox="0 0 24 24"><path d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12 0c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
      <span>MUSIK</span>
    </button>
  </div>

  <script>
    // System Spotify Playlist Track List Contoh (Bisa Kamu Ubah MP3 Link-nya)
    const playlist = [
      {
        title: "Justin Bieber - Beauty And A Beat",
        artist: "Justin Bieber",
        cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&auto=format&fit=crop&q=60",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
      },
      {
        title: "Spotify Playlist Song 2",
        artist: "Artist Name",
        cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500&auto=format&fit=crop&q=60",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
      }
    ];

    let currentTrack = 0;

    const navMusic = document.getElementById('navMusic');
    const modalMusic = document.getElementById('modalMusic');
    const btnCloseMusic = document.getElementById('btnCloseMusic');
    const bgAudio = document.getElementById('bgAudio');
    const btnMusicPlay = document.getElementById('btnMusicPlay');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const musicSeek = document.getElementById('musicSeek');
    const currentTimeEl = document.getElementById('currentTime');
    const totalTimeEl = document.getElementById('totalTime');
    const volumeSlider = document.getElementById('volumeSlider');
    const songTitle = document.getElementById('songTitle');
    const songArtist = document.getElementById('songArtist');
    const musicCover = document.getElementById('musicCover');
    const btnNext = document.getElementById('btnNext');
    const btnPrev = document.getElementById('btnPrev');

    // Buka / Tutup Popup Music Player
    navMusic.addEventListener('click', () => {
      modalMusic.classList.remove('hidden');
    });

    btnCloseMusic.addEventListener('click', () => {
      modalMusic.classList.add('hidden');
    });

    // Play & Pause Logic
    btnMusicPlay.addEventListener('click', () => {
      if (bgAudio.paused) {
        bgAudio.play();
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
      } else {
        bgAudio.pause();
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
      }
    });

    // Slider Progress Syncing
    bgAudio.addEventListener('timeupdate', () => {
      if (bgAudio.duration) {
        const progress = (bgAudio.currentTime / bgAudio.duration) * 100;
        musicSeek.value = progress;
        
        let curMins = Math.floor(bgAudio.currentTime / 60);
        let curSecs = Math.floor(bgAudio.currentTime % 60);
        if (curSecs < 10) curSecs = '0' + curSecs;
        currentTimeEl.innerText = `${curMins}:${curSecs}`;

        let durMins = Math.floor(bgAudio.duration / 60);
        let durSecs = Math.floor(bgAudio.duration % 60);
        if (durSecs < 10) durSecs = '0' + durSecs;
        totalTimeEl.innerText = `${durMins}:${durSecs}`;
      }
    });

    musicSeek.addEventListener('input', () => {
      if (bgAudio.duration) {
        bgAudio.currentTime = (musicSeek.value / 100) * bgAudio.duration;
      }
    });

    volumeSlider.addEventListener('input', (e) => {
      bgAudio.volume = e.target.value;
    });

    // Prev / Next Track Function
    function loadTrack(index) {
      const track = playlist[index];
      songTitle.innerText = track.title;
      songArtist.innerText = track.artist;
      musicCover.src = track.cover;
      bgAudio.src = track.src;
      bgAudio.play();
      playIcon.classList.add('hidden');
      pauseIcon.classList.remove('hidden');
    }

    btnNext.addEventListener('click', () => {
      currentTrack = (currentTrack + 1) % playlist.length;
      loadTrack(currentTrack);
    });

    btnPrev.addEventListener('click', () => {
      currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
      loadTrack(currentTrack);
    });
  </script>
</body>
</html>
