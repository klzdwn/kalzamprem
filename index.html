<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KALZ AM PREM</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      /* Background Gradien Radial Dark Chrome */
      background: radial-gradient(circle at 50% 20%, #1a1c23 0%, #08090c 60%, #000000 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 20px 100px 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Background Glow Gradien Monochrome */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      animation: float 10s infinite alternate ease-in-out;
    }

    .blob-1 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0) 70%);
      top: 10%;
      left: 15%;
    }

    .blob-2 {
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(160, 160, 175, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
      bottom: 15%;
      right: 15%;
    }

    @keyframes float {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-30px) scale(1.1); }
    }

    /* Card Utama dengan Border & Background Gradien Dark Glass */
    .glass-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: linear-gradient(145deg, rgba(30, 32, 40, 0.7) 0%, rgba(12, 13, 18, 0.8) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.85);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    /* Judul Gradien Silver Metallic */
    .header h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 6px;
    }

    /* Step Tracker dengan Accent Gradien */
    .step-tracker {
      display: flex;
      justify-content: space-between;
      margin-bottom: 24px;
      position: relative;
    }

    .step-tracker::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.05) 100%);
      z-index: 0;
      transform: translateY(-50%);
    }

    .step-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #0f1117;
      border: 2px solid rgba(255, 255, 255, 0.2);
      color: #71717a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      position: relative;
      z-index: 1;
    }

    .step-circle.active {
      background: linear-gradient(135deg, #ffffff 0%, #d4d4d8 100%);
      border-color: #ffffff;
      color: #000000;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
    }

    .form-group { margin-bottom: 8px; }

    label {
      display: block;
      color: #e4e4e7;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.03) 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    input:focus {
      border-color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
    }

    /* Pesan Error */
    .error-msg {
      color: #f87171;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 6px;
    }

    .info-box {
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.02) 100%);
      border-left: 3px solid #ffffff;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      color: #a1a1aa;
      margin-bottom: 18px;
    }

    /* Tombol Utama Gradien Silver-White */
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #050505;
      cursor: pointer;
      background: linear-gradient(135deg, #ffffff 0%, #e4e4e7 50%, #a1a1aa 100%);
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.25);
      transition: all 0.2s ease;
      margin-top: 8px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 255, 255, 0.35);
    }

    /* OVERLAY MODAL */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 99;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .hidden { display: none !important; }

    /* POPUP MUSIC PLAYER */
    .music-modal-card {
      background: linear-gradient(160deg, #18181b 0%, #09090b 100%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 28px;
      width: 100%;
      max-width: 380px;
      padding: 20px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95);
      position: relative;
      animation: modalPop 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes modalPop {
      from { transform: scale(0.9) translateY(15px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #a1a1aa;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .now-playing-tag {
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    .now-playing-tag span {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #ffffff;
      border-radius: 50%;
    }

    /* BOTTOM NAVBAR GRADIENT */
    .bottom-nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(30, 32, 40, 0.85) 0%, rgba(12, 13, 18, 0.9) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 50px;
      padding: 6px 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 14px;
      border-radius: 20px;
      color: #a1a1aa;
      background: transparent;
      border: none;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      gap: 4px;
      transition: color 0.2s;
    }

    .nav-item:hover {
      color: #ffffff;
    }

    .nav-item svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    /* Tombol Home Bulat Gradien */
    .nav-item-center {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff 0%, #d4d4d8 100%);
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.35);
      margin: 0 6px;
    }

    .nav-item-center svg {
      width: 20px;
      height: 20px;
      stroke: #000000;
      fill: none;
      stroke-width: 2.2;
    }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="glass-card">
    <div class="header">
      <h1>KALZ AM PREM</h1>
      <p>Langkah 1: Masukkan email akun Alight Motion</p>
    </div>

    <div class="step-tracker">
      <div class="step-circle active">1</div>
      <div class="step-circle">2</div>
      <div class="step-circle">3</div>
    </div>

    <div>
      <div class="info-box">
        Ketik email yang terhubung dengan Alight Motion kamu. Sistem akan mengirim tautan masuk (Magic Link) ke email tersebut.
      </div>
      <div class="form-group">
        <label for="email">Alamat Email</label>
        <input type="email" id="email" placeholder="contoh@gmail.com">
      </div>
      
      <!-- NOTIFIKASI ERROR EMAIL KOSONG -->
      <div class="error-msg" id="errorMsg">
        ⚠️ mohon masukan email terlebih dahulu
      </div>

      <button class="btn" id="btnSend">Kirim Magic Link</button>
    </div>
  </div>

  <!-- POPUP MUSIC PLAYER -->
  <div class="modal-overlay hidden" id="modalMusic">
    <div class="music-modal-card">
      <button class="close-btn" id="btnCloseMusic">&times;</button>

      <div class="now-playing-tag">
        <span></span> SPOTIFY PLAYLIST
      </div>

      <iframe 
        id="spotifyPlayer"
        style="border-radius:16px;" 
        src="https://open.spotify.com/embed/playlist/4dWDoT3WBviqWbXK2aX8Rr?utm_source=generator&theme=0" 
        width="100%" 
        height="380" 
        frameBorder="0" 
        allowfullscreen="" 
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
        loading="lazy">
      </iframe>
    </div>
  </div>

  <!-- BOTTOM NAVBAR (NO WA 087863683554) -->
  <div class="bottom-nav">
    <a href="https://wa.me/6287863683554" target="_blank" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 21l1.9-5.7a8.5 8.5 0 113.8 3.8z"/></svg>
      <span>WHATSAPP</span>
    </a>

    <button class="nav-item-center" id="navHome">
      <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </button>

    <button class="nav-item" id="navMusic">
      <svg viewBox="0 0 24 24"><path d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12 0c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
      <span>MUSIK</span>
    </button>
  </div>

  <script>
    const navMusic = document.getElementById('navMusic');
    const modalMusic = document.getElementById('modalMusic');
    const btnCloseMusic = document.getElementById('btnCloseMusic');
    const btnSend = document.getElementById('btnSend');
    const emailInput = document.getElementById('email');
    const errorMsg = document.getElementById('errorMsg');

    // Validasi Email Kosong
    btnSend.addEventListener('click', () => {
      if (emailInput.value.trim() === '') {
        errorMsg.style.display = 'flex';
        emailInput.style.borderColor = '#f87171';
      } else {
        errorMsg.style.display = 'none';
        emailInput.style.borderColor = 'rgba(255, 255, 255, 0.15)';
        alert('Magic Link berhasil dikirim ke ' + emailInput.value);
      }
    });

    // Reset error pas user mulai ngetik
    emailInput.addEventListener('input', () => {
      if (emailInput.value.trim() !== '') {
        errorMsg.style.display = 'none';
        emailInput.style.borderColor = 'rgba(255, 255, 255, 0.15)';
      }
    });

    // Popup Spotify
    navMusic.addEventListener('click', () => {
      modalMusic.classList.remove('hidden');
    });

    btnCloseMusic.addEventListener('click', () => {
      modalMusic.classList.add('hidden');
    });
  </script>
</body>
</html>
