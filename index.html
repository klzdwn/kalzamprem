<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alight Motion Tools</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      margin-bottom: 20px;
      text-align: center;
      color: #38bdf8;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #94a3b8;
    }
    input[type="text"], input[type="email"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    input:focus {
      border-color: #38bdf8;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #0284c7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 5px;
    }
    button:hover {
      background-color: #0369a1;
    }
    .log-box {
      margin-top: 20px;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px;
      font-family: monospace;
      font-size: 12px;
      max-height: 150px;
      overflow-y: auto;
      color: #4ade80;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Alight Tools</h2>
    
    <div class="form-group">
      <label for="email">Email Account</label>
      <input type="email" id="email" placeholder="masukkan email anda...">
    </div>

    <button id="btnSend">1. Kirim Magic Link</button>

    <div class="form-group" style="margin-top: 15px;">
      <label for="magiclink">Raw Magic Link</label>
      <input type="text" id="magiclink" placeholder="tempel magic link di sini...">
    </div>

    <button id="btnProcess">2. Proses Akun</button>

    <div class="log-box" id="logs">Status log akan tampil di sini...</div>
  </div>

  <script>
    const API_URL = 'https://anita-studio.netlify.app/.netlify/functions/amprem';
    const logs = document.getElementById('logs');

    function log(msg) {
      logs.innerHTML += `<div>> ${msg}</div>`;
      logs.scrollTop = logs.scrollHeight;
    }

    document.getElementById('btnSend').addEventListener('click', async () => {
      const email = document.getElementById('email').value;
      if (!email) return alert('Email wajib diisi!');

      log('Sending Magic Link...');
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'send-magiclink', email })
        });
        const data = await res.json();
        log(JSON.stringify(data));
      } catch (err) {
        log('Error: ' + err.message);
      }
    });

    document.getElementById('btnProcess').addEventListener('click', async () => {
      const email = document.getElementById('email').value;
      const rawLink = document.getElementById('magiclink').value;
      if (!email || !rawLink) return alert('Email dan Magic Link wajib diisi!');

      log('Verifying Link...');
      try {
        const verifyRes = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'verify-account', email, rawLink })
        });
        const verifyData = await verifyRes.json();
        log(JSON.stringify(verifyData));

        const idToken = verifyData.idToken || verifyData.profile?.idToken;
        if (!idToken) throw new Error('idToken tidak ditemukan!');

        log('Applying Premium...');
        const premRes = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'apply-premium', email, idToken })
        });
        const premData = await premRes.json();
        log(JSON.stringify(premData));
      } catch (err) {
        log('Error: ' + err.message);
      }
    });
  </script>

</body>
</html>
