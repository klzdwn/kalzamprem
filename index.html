<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KALZ AM PREM</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: #090d16;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Efek Bola Cahaya */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      animation: float 10s infinite alternate ease-in-out;
    }

    .blob-1 {
      width: 300px;
      height: 300px;
      background: rgba(147, 51, 234, 0.45);
      top: 10%;
      left: 15%;
    }

    .blob-2 {
      width: 250px;
      height: 250px;
      background: rgba(59, 130, 246, 0.45);
      bottom: 15%;
      right: 15%;
    }

    .blob-3 {
      width: 200px;
      height: 200px;
      background: rgba(236, 72, 153, 0.35);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    @keyframes float {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-30px) scale(1.1); }
    }

    /* Card Glassmorphism */
    .glass-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      color: #ffffff;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header p {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 6px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    input::placeholder {
      color: #64748b;
    }

    input:focus {
      border-color: rgba(168, 85, 247, 0.8);
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
      background: rgba(255, 255, 255, 0.09);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
      box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4);
    }

    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .hidden {
      display: none !important;
    }

    /* Full Page Terminal/Log Box (Step 3) */
    .log-box {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 16px;
      font-family: monospace;
      font-size: 13px;
      min-height: 200px;
      max-height: 300px;
      overflow-y: auto;
      color: #38bdf8;
    }

    .log-entry {
      margin-bottom: 8px;
      word-break: break-all;
      line-height: 1.4;
    }

    .log-entry.error {
      color: #f87171;
    }

    .log-entry.success {
      color: #4ade80;
    }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="glass-card">
    <div class="header">
      <h1 id="pageTitle">KALZ AM PREM</h1>
      <p id="pageDesc">Masukan email dan verifikasi magic link kamu</p>
    </div>

    <!-- PAGE 1: EMAIL -->
    <div id="step1">
      <div class="form-group">
        <label for="email">1. ALAMAT EMAIL</label>
        <input type="email" id="email" placeholder="contoh@gmail.com" required>
      </div>
      <button id="btnSend" class="btn btn-primary">Kirim Magic Link</button>
    </div>

    <!-- PAGE 2: MAGIC LINK -->
    <div id="step2" class="hidden">
      <div class="form-group">
        <label for="rawLink">2. RAW MAGIC LINK</label>
        <input type="text" id="rawLink" placeholder="Tempel magic link dari email...">
      </div>
      <button id="btnProcess" class="btn btn-secondary">Proses Premium</button>
    </div>

    <!-- PAGE 3: STATUS PROCESS LOG -->
    <div id="step3" class="hidden">
      <div class="log-box" id="logBox"></div>
      <button id="btnReset" class="btn btn-primary" style="margin-top: 16px;">Kembali ke Awal</button>
    </div>
  </div>

  <script>
    const API_URL = 'https://anita-studio.netlify.app/.netlify/functions/amprem';

    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const step3 = document.getElementById('step3');
    
    const pageTitle = document.getElementById('pageTitle');
    const pageDesc = document.getElementById('pageDesc');

    const emailInput = document.getElementById('email');
    const rawLinkInput = document.getElementById('rawLink');
    const btnSend = document.getElementById('btnSend');
    const btnProcess = document.getElementById('btnProcess');
    const btnReset = document.getElementById('btnReset');
    const logBox = document.getElementById('logBox');

    function log(message, type = 'normal') {
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.innerText = `> ${message}`;
      logBox.appendChild(entry);
      logBox.scrollTop = logBox.scrollHeight;
    }

    // Step 1: Kirim Magic Link
    btnSend.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      if (!email) {
        alert('Harap masukkan email terlebih dahulu!');
        return;
      }

      btnSend.disabled = true;
      btnSend.innerText = 'Mengirim...';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'send-magiclink', email })
        });

        const data = await response.json();
        
        if (data.success) {
          step1.classList.add('hidden');
          step2.classList.remove('hidden');
          pageDesc.innerText = 'Tempel tautan verifikasi yang ada di email kamu';
        } else {
          alert(data.message || 'Gagal mengirim magic link');
          btnSend.disabled = false;
          btnSend.innerText = 'Kirim Magic Link';
        }
      } catch (err) {
        alert(`Gagal terhubung ke API: ${err.message}`);
        btnSend.disabled = false;
        btnSend.innerText = 'Kirim Magic Link';
      }
    });

    // Step 2: Verifikasi & Apply Premium
    btnProcess.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const rawLink = rawLinkInput.value.trim();

      if (!rawLink) {
        alert('Raw Magic Link wajib diisi!');
        return;
      }

      // Pindah ke Page 3 (Status Page)
      step2.classList.add('hidden');
      step3.classList.remove('hidden');
      pageTitle.innerText = 'STATUS PROSES';
      pageDesc.innerText = 'Mohon tunggu hingga proses aktivasi selesai';

      logBox.innerHTML = '';
      log('Memulai verifikasi tautan...');

      try {
        const verifyRes = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'verify-account', email, rawLink })
        });

        const verifyData = await verifyRes.json();

        if (!verifyData.success) {
          throw new Error(verifyData.message || 'Verifikasi gagal');
        }

        const idToken = verifyData.idToken || verifyData.profile?.idToken;
        if (!idToken) {
          throw new Error('idToken tidak ditemukan dari hasil verifikasi');
        }

        log('Verifikasi berhasil!', 'success');
        log('Mengaktifkan status premium...');

        const premRes = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'apply-premium', email, idToken })
        });

        const premData = await premRes.json();
        
        if (premData.success) {
          log('Aktivasi Premium Berhasil!', 'success');
          log(JSON.stringify(premData), 'success');
        } else {
          log(`Gagal Aktivasi: ${premData.message || 'Terjadi kesalahan'}`, 'error');
        }

      } catch (err) {
        log(`Error: ${err.message}`, 'error');
      }
    });

    // Reset tombol untuk kembali ke Page 1
    btnReset.addEventListener('click', () => {
      step3.classList.add('hidden');
      step1.classList.remove('hidden');
      
      pageTitle.innerText = 'KALZ AM PREM';
      pageDesc.innerText = 'Masukan email dan verifikasi magic link kamu';
      
      btnSend.disabled = false;
      btnSend.innerText = 'Kirim Magic Link';
      btnProcess.disabled = false;
      btnProcess.innerText = 'Proses Premium';
      
      emailInput.value = '';
      rawLinkInput.value = '';
    });
  </script>
</body>
</html>
